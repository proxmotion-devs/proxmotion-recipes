name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: recipes
          persist-credentials: false

      # The panel provides the JSON Schemas, the shared scripts and the package commands.
      - uses: actions/checkout@v4
        with:
          repository: proxmotion-devs/proxmotion
          ref: main
          path: proxmotion
          persist-credentials: false

      - name: Base revision of the packages
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: recipes-base
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install panel dependencies
        working-directory: proxmotion/panel
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Validate the packages
        working-directory: proxmotion/panel
        run: php artisan apps:validate --path="$GITHUB_WORKSPACE/recipes"

      - name: Changed packages have a new version
        if: github.event_name == 'pull_request'
        working-directory: proxmotion/panel
        run: php artisan apps:check-versions --base-path="$GITHUB_WORKSPACE/recipes-base" --path="$GITHUB_WORKSPACE/recipes"

      # Inside the checkout, so shellcheck finds .shellcheckrc.
      - name: Unpack the packages
        working-directory: recipes
        run: |
          mkdir -p .unpacked
          for package in */*.proxapp; do unzip -q -o "$package" -d .unpacked; done

      - name: shellcheck
        working-directory: recipes
        run: |
          files=$(find .unpacked -name '*.sh' | sort)
          if [ -n "$files" ]; then shellcheck $files; else echo "No shell scripts"; fi

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          $files = Get-ChildItem -Recurse -Filter *.ps1 -Path "$env:GITHUB_WORKSPACE/recipes/.unpacked", "$env:GITHUB_WORKSPACE/proxmotion/panel/recipes/_lib"
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $failed = $true; Write-Error "$($file.FullName): $($errors[0].Message)" }
          }
          if ($failed) { exit 1 }
